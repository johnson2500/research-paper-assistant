[project]
name = "ingestion"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pypdf>=4",
    "trafilatura>=1.9",
    "httpx>=0.27",
    "langchain-text-splitters>=0.2",
    "openai>=1.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
